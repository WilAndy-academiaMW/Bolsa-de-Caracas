<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Trading Venezuela</title>
    <link rel="stylesheet" href="../static/css/app.css">
    <style>
        .login-container {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg);
        }
        .login-card {
            background: var(--panel-bg);
            border: 4px solid var(--border);
            padding: 40px;
            width: 95%;
            max-width: 400px;
            box-shadow: 15px 15px 0px var(--accent-alt);
            text-align: center;
        }
        .login-card h2 {
            text-transform: uppercase;
            background: var(--border);
            color: var(--bg);
            display: inline-block;
            padding: 5px 15px;
            margin-bottom: 25px;
            transform: skewX(-5deg);
        }
        input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: #000;
            border: 3px solid var(--border);
            color: var(--accent);
            font-family: inherit;
            outline: none;
        }
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: var(--accent);
            color: var(--bg);
            border: none;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 5px 5px 0px var(--border);
            margin-top: 10px;
        }
        /* ESTILO DEL MENSAJE DE ERROR */
        .error-box {
            margin-top: 20px;
            background: var(--accent-alt);
            color: white;
            padding: 10px;
            border: 2px solid white;
            font-weight: bold;
            font-size: 0.85rem;
            text-transform: uppercase;
            box-shadow: 4px 4px 0px #000;
        }
        .back-link { display: block; margin-top: 20px; color: var(--muted); text-decoration: none; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h2>OPERADOR LOGIN</h2>
            
            <form action="/login" method="POST">
                <input type="text" name="usuario" placeholder="USUARIO" required>
                <input type="password" name="password" placeholder="CONTRASEÑA" required>
                <button type="submit" class="btn-submit">VERIFICAR ACCESO</button>
            </form>

            {% with messages = get_flashed_messages() %}
              {% if messages %}
                {% for message in messages %}
                  <div class="error-box">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <a href="/" class="back-link">← VOLVER AL INICIO</a>
        </div>
    </div>
</body>
</html>
