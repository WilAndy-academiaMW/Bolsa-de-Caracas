

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trading Venezuela | Members Only</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../static/css/app.css" />
</head>
<body>

  {% if not usuario_autenticado %}
  <section id="gatekeeper">
    <div class="login-card">
      <h1>INGRESO</h1>
      <p style="color: var(--muted); margin-bottom: 20px;">Acceso exclusivo a terminal de datos BVC</p>
      
      <form action="/login" method="POST">
        <input type="text" name="usuario" placeholder="USUARIO" required autofocus>
        <input type="password" name="password" placeholder="CONTRASEÑA" required>
        <button type="submit" class="btn-login">Desbloquear Terminal</button>
      </form>

      <p style="font-size: 0.7rem; margin-top: 30px; color: var(--accent);">TRADING VENEZUELA v2.0</p>
    </div>
  </section>

  {% else %}
  <header class="nav">
    <div class="nav__brand">TRADING VENEZUELA</div>
    <nav class="nav__links">
      <a href="/">Inicio</a>
      <a href="/index2">Gráfica</a>
      <a href="/index3">Volumen</a>
      <a href="/index4">Datos</a>
      <a href="/logout" style="color: var(--accent-alt);">Salir</a>
    </nav>
  </header>

  <main class="container">
    <div class="panel__controls">
      <button class="btn-filter active">24h</button>
      <button class="btn-filter">Todo</button>
    </div>

    <section id="docs" class="panel">
      <div class="panel__header">
        <h2>Tabla de Acciones</h2>
      </div>
      <div class="table-responsive">
        <table id="accionesTable">
          <thead>
            <tr>
              <th>Acción</th>
              <th>Precio</th>
              <th>Var. Rel</th>
              <th>Monto Efectivo</th>
            </tr>
          </thead>
          <tbody>
            </tbody>
        </table>
      </div>
    </section>

    <div class="radar-grid">
      <div class="radar-box"><h4 class="radar-title">⚡ MOMENTUM</h4><div id="radar-scalping"></div></div>
      <div class="radar-box"><h4 class="radar-title">📅 MENSUAL</h4><div id="radar-day"></div></div>
      <div class="radar-box"><h4 class="radar-title">🌊 TENDENCIA</h4><div id="radar-swing"></div></div>
      <div class="radar-box"><h4 class="radar-title">🏦 INSTITUCIONAL</h4><div id="radar-institucional"></div></div>
    </div>
  </main>

  <script src="../static/js/app/tabla.js"></script>
  {% endif %}

</body>
</html>
