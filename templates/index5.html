<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trading Venezuela | Radar Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/inicio/inicio.css') }}" />
</head>
<body>

  <header class="nav">
    <div class="nav__brand">TRADING VENEZUELA</div>
    <nav class="nav__links">
      <a href="/index5">Resumen</a>
      <a href="/index2">Gráfica</a>
      <a href="/index4">Datos</a>
    </nav>
  </header>

  <main class="container">
    <div class="filter-wrapper">
      <div class="panel__controls">
        <button class="btn-filter active" data-filter="24">24H</button>
        <button class="btn-filter" data-filter="48">48H</button>
        <button class="btn-filter" data-filter="7">7D</button>
        <button class="btn-filter" data-filter="all">TODO</button>
      </div>
    </div>

    <section class="panel">
      <div class="panel__header">
        <h2>TABLA DE ACCIONES</h2>
      </div>
     
      <div class="table-responsive">
        <table id="accionesTable">
          <thead>
            <tr>
              <th>Acción</th>
              <th>Precio</th>
              <th>Var. Abs</th>
              <th>Var. Rel</th>
              <th>Monto</th>
            </tr>
          </thead>
          <tbody>
            </tbody>
          <tfoot>
            <tr>
              <td colspan="4"><strong>TOTAL MERCADO</strong></td>
              <td id="totalMonto">0</td>
            </tr>
          </tfoot>
        </table>
      </div>
    </section>

    <section class="radar-grid">
        <div class="radar-box">
            <h4 class="radar-title">⚡ MOMENTUM</h4>
            <div id="radar-scalping" class="radar-list"></div>
        </div>
        <div class="radar-box">
            <h4 class="radar-title">📅 DIARIO</h4>
            <div id="radar-day" class="radar-list"></div>
        </div>
        <div class="radar-box">
            <h4 class="radar-title">🌊 SWING</h4>
            <div id="radar-swing" class="radar-list"></div>
        </div>
        <div class="radar-box">
            <h4 class="radar-title">🏦 INSTITUCIONAL</h4>
            <div id="radar-institucional" class="radar-list"></div>
        </div>
    </section>
  </main>

  <script src="../static/js/smart.js"></script>
  <script src="../static/js/app/tabla.js"></script>
</body>
</html>
